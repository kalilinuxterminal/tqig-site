<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tqig</title>
<meta property="og:title" content="tqig" />
<meta property="og:description" content="tqig.space" />
<link rel="icon" type="image/webp" href="icon.webp" />
<link rel="apple-touch-icon" href="icon.webp" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
  body{background:#000;color:#fff;min-height:100vh;overflow:hidden;cursor:default}
  .bg{position:fixed;inset:-3%;background-image:url('thumbbig-591827.png'),url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1920&auto=format&fit=crop');background-position:center;background-size:cover;background-repeat:no-repeat;filter:grayscale(1) brightness(.5);animation:zoom 24s ease-in-out infinite alternate}
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
  .bg:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.78) 100%),linear-gradient(to bottom,rgba(0,0,0,.3),transparent 30%,transparent 70%,rgba(0,0,0,.5))}
  .fog{position:fixed;inset:0;background:radial-gradient(400px 200px at 20% 80%,rgba(255,255,255,.06),transparent),radial-gradient(500px 250px at 80% 20%,rgba(255,255,255,.05),transparent);animation:fog 12s ease-in-out infinite alternate;pointer-events:none}
  @keyframes fog{from{opacity:.5;transform:translateX(-2%)}to{opacity:1;transform:translateX(2%)}}
  .grain{position:fixed;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
  #bgvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.5);z-index:0}
  canvas#stars{position:fixed;inset:0;pointer-events:none;opacity:.9;z-index:1}
  #typed{background:linear-gradient(100deg,#777 30%,#fff 50%,#777 70%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3.2s linear infinite;display:inline-block}
  @keyframes shimmer{to{background-position:220% center}}
  canvas#qrain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.85}
  canvas#trail{position:fixed;inset:0;pointer-events:none;z-index:60}
  #glow{position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);transform:translate(-50%,-50%);z-index:3}
  #enter{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#000;cursor:pointer;transition:opacity .5s}
  #enter.hide{opacity:0;pointer-events:none}
  #enter .logo{font-size:46px;font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#fff 20%,#777);-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,.75))}}
  #enter .pill-btn{position:relative;font-size:14px;letter-spacing:3px;color:#fff;border:1px solid rgba(255,255,255,.35);padding:14px 38px;border-radius:100px;background:rgba(255,255,255,.05);overflow:hidden;animation:pulse 1.8s infinite;transition:.2s}
  #enter .pill-btn:before{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
  #enter:hover .pill-btn{background:#fff;color:#000}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  #main{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;filter:blur(12px);transform:translateY(14px);transition:all .9s}
  #main.show{opacity:1;filter:none;transform:none}
  .card{width:min(390px,90vw);background:rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:30px 26px 20px;text-align:center;backdrop-filter:blur(26px);box-shadow:0 30px 90px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12);transform-style:preserve-3d;transition:transform .2s;position:relative;overflow:hidden}
  .card:before{content:'';position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.09),transparent);transform:skewX(-20deg);animation:shine 5s infinite}
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .avatar-wrap{position:relative;width:100px;height:100px;margin:0 auto 12px}
  .avatar-wrap:before{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,#fff,#333,#fff,#333,#fff);animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{position:absolute;inset:4px;border-radius:50%;background:#0a0a0a url('pfp.png') center/cover;overflow:hidden}
  .status{position:absolute;bottom:8px;right:8px;width:22px;height:22px;background:#22c55e;border:3px solid #000;border-radius:50%;box-shadow:0 0 12px #22c55e}
  h1{font-size:29px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#fff 30%,#999);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  .badge{display:inline-block;font-size:13px;background:#fff;color:#000;border-radius:50%;width:20px;height:20px;line-height:20px;margin-left:6px;vertical-align:middle}
  .pills{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .pill{font-size:11px;border:1px solid rgba(255,255,255,.2);border-radius:100px;padding:4px 12px;color:#ccc;background:rgba(255,255,255,.05)}
  .bio{margin:14px 0 4px;min-height:20px;font-size:13.5px;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);padding:8px 16px;border-radius:100px;display:inline-block;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:opacity .45s}
  @keyframes blink{50%{opacity:0}}
  .blabel{display:flex;align-items:center;gap:10px}
  .blabel svg{width:18px;height:18px;flex:none}
  .links{display:flex;justify-content:center;gap:10px;margin:16px 0 8px}
  .icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;transition:.18s}
  .icon:hover{background:#fff;color:#000;transform:translateY(-3px) scale(1.05);box-shadow:0 8px 25px rgba(255,255,255,.3)}
  a.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.24);padding:13px 16px;border-radius:14px;margin:9px 0;font-weight:600;font-size:14px;transition:.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 18px rgba(0,0,0,.5)}
  a.btn:before{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .5s}
  a.btn:hover:before{left:130%}
  a.btn small{opacity:.5;font-weight:400;transition:.18s}
  a.btn:hover{background:#fff;color:#000;transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,255,255,.28)}
  a.btn:hover small{opacity:1;transform:translate(3px,-3px)}
  .eq{display:flex;gap:3px;align-items:end;height:16px}
  .eq i{width:3px;background:currentColor;display:block;animation:eq 1s infinite ease-in-out}
  .eq i:nth-child(1){height:60%}.eq i:nth-child(2){height:100%;animation-delay:.15s}.eq i:nth-child(3){height:40%;animation-delay:.3s}
  @keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
  .foot{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:#888}
  #cur{position:fixed;width:18px;height:18px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);color:#fff;font-size:18px;line-height:1;text-shadow:0 0 8px #fff,0 0 16px rgba(255,255,255,.8);opacity:0}
  #curRing{display:none}
  @media(hover:hover){body,a,button,input{cursor:none}}
  @media(hover:none){#cur,#trail{display:none}}
  @media(max-width:520px){
    #main{padding:10px}
    .card{width:min(250px,72vw);padding:16px 12px 10px;border-radius:18px;background:rgba(0,0,0,.12)}
    .avatar-wrap{width:60px;height:60px;margin-bottom:8px}
    h1{font-size:20px}
    .badge{width:15px;height:15px;line-height:15px;font-size:10px}
    .pill{font-size:9px;padding:2px 8px}
    .bio{font-size:11px;margin:8px 0 2px;padding:6px 12px}
    .location{font-size:10px;margin-bottom:10px}
    .links{margin:8px 0 5px}
    .icon{width:36px;height:36px}
    a.btn{padding:8px 10px;font-size:12px;margin:6px 0}
    .foot{font-size:10px;margin-top:8px}
  }
</style>
</head>
<body>
<div class="bg"></div>
<video id="bgvid" autoplay muted loop playsinline poster="thumbbig-591827.png"><source src="1004%20(online-video-cutter.com).mp4" type="video/mp4"></video>
<div class="fog"></div>
<canvas id="stars"></canvas>
<canvas id="qrain"></canvas>
<canvas id="trail"></canvas>
<div class="grain"></div>
<div id="glow"></div>
<div id="cur">✦</div>
<audio id="bgm" loop preload="auto"><source src="serial%20experiment%20lain.mp3" type="audio/mpeg"></audio>
<div id="enter"><div class="logo">tqig</div><div class="pill-btn">click to enter</div></div>
<div id="main">
  <div class="card" id="card">
    <div class="avatar-wrap"><div class="avatar"></div></div>
    <div><h1>tqig</h1><span class="badge">✓</span></div>
    <div class="pills"><span class="pill">uid 1</span></div>
    <div class="bio"><span id="typed">presented to you by @tqig / @euroeth</span></div>
    <a class="btn" href="https://www.instagram.com/euroeth/" target="_blank"><span class="blabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>instagram</span><small>↗</small></a>
    <a class="btn" href="https://www.tiktok.com/@tqig" target="_blank"><span class="blabel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>tiktok</span><small>↗</small></a>
    <div class="foot"><span>© tqig • <span class="eq"><i></i><i></i><i></i></span></span><span>👁 <span id="views">1</span></span></div>
  </div>
</div>
<script>
const enter=document.getElementById('enter'),main=document.getElementById('main');
enter.addEventListener('click',()=>{enter.classList.add('hide');main.classList.add('show');typeLoop();
const a=document.getElementById('bgm');if(a){a.currentTime=0;a.volume=.5;a.play().catch(()=>{})}});
function typeLoop(){document.getElementById('typed').textContent="presented to you by @tqig / @euroeth"}
document.title="tqig";
// casual copy deterrents (guns.lol style - won't stop determined viewers, nothing can)
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key))||(e.ctrlKey&&e.key==='U'))e.preventDefault()});
// clean comet cursor trail: thin ribbon, no glow blobs
const cur=document.getElementById('cur');let mx=0,my=0,moved=false;
const tc=document.getElementById('trail'),tx=tc.getContext('2d');let TW,TH;const hist=[];
function trs(){TW=tc.width=innerWidth;TH=tc.height=innerHeight}trs();addEventListener('resize',trs);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';
if(!moved){moved=true;cur.style.opacity='1';for(let i=0;i<70;i++)hist.push({x:mx,y:my})}});
(function tloop(){tx.clearRect(0,0,TW,TH);
hist.push({x:mx,y:my});if(hist.length>70)hist.shift();
for(let i=1;i<hist.length;i++){const a=i/hist.length;tx.globalAlpha=a*.95;tx.strokeStyle='#fff';tx.lineWidth=1+a*3.6;tx.lineCap='round';tx.beginPath();tx.moveTo(hist[i-1].x,hist[i-1].y);tx.lineTo(hist[i].x,hist[i].y);tx.stroke()}
tx.globalAlpha=1;requestAnimationFrame(tloop)})();
let v=parseInt(localStorage.getItem('tqig_views')||'1346'),lt=parseInt(localStorage.getItem('tqig_ts')||Date.now().toString());
const gaps=Math.floor((Date.now()-lt)/300000);
for(let k=0;k<gaps;k++){v+=2+Math.floor(Math.random()*2);if(v>=10000)v=1346}
v+=1;if(v>=10000)v=1346;
localStorage.setItem('tqig_views',v);localStorage.setItem('tqig_ts',Date.now().toString());
document.getElementById('views').textContent=v.toLocaleString('en-US');
// slow quote rain: readable falling lines
const qc=document.getElementById('qrain'),qx=qc.getContext('2d');let QW,QH;
const qlines=["The blueprint is believing in yourself","the cheat code is discipline and consistency","the truth is nobody is coming to save u"];
function qrs(){QW=qc.width=innerWidth;QH=qc.height=innerHeight}qrs();addEventListener('resize',qrs);
let drops=[];
function qspawn(){qlines.forEach((ln,i)=>drops.push({x:QW/2,y:-60-i*260,line:ln,v:1.05}))}
qspawn();setInterval(()=>{if(drops.length===0)qspawn()},30000);
(function qloop(){qx.clearRect(0,0,QW,QH);const fs=Math.min(34,Math.max(19,QW/26));qx.font='700 '+fs+'px ui-monospace,Menlo,Consolas,monospace';qx.textAlign='center';
drops.forEach(o=>{o.y+=o.v;qx.globalAlpha=.85;qx.fillStyle='#fff';qx.shadowColor='#fff';qx.shadowBlur=12;qx.fillText(o.line,o.x,o.y)});drops=drops.filter(o=>o.y<QH+80);qx.shadowBlur=0;qx.globalAlpha=1;requestAnimationFrame(qloop)})();
// tilt
const card=document.getElementById('card');
let spin=0,spinning=false;
setInterval(()=>{spin+=360;spinning=true;card.style.transition='transform 3s cubic-bezier(.65,0,.35,1)';card.style.transform=`perspective(900px) rotateY(${spin}deg)`;setTimeout(()=>{spinning=false;card.style.transition='transform .2s'},3050)},5000);
addEventListener('mousemove',e=>{if(spinning)return;const r=card.getBoundingClientRect();const dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height/2))/r.height;card.style.transform=`perspective(900px) rotateY(${spin+dx*10}deg) rotateX(${-dy*10}deg)`;
const g=document.getElementById('glow');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
// stars
const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,p=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
for(let k=0;k<140;k++)p.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*1.8+.4,v:Math.random()*1.3+.3,tw:Math.random()*6});
(function loop(){x.clearRect(0,0,W,H);p.forEach(o=>{o.y+=o.v;o.tw+=.04;if(o.y>H){o.y=0;o.x=Math.random()*W}x.globalAlpha=.25+Math.abs(Math.sin(o.tw))*.75;x.fillStyle='#fff';x.beginPath();x.arc(o.x,o.y,o.s,0,7);x.fill()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
