name: TQIG checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
  portal-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.portal -t tqig-portal:check .
      - name: Check the production dashboard and account boundary
        run: |
          set -euo pipefail
          docker run -d --name tqig-portal -p 127.0.0.1:18770:8770 tqig-portal:check
          trap 'if [ "$?" -ne 0 ]; then docker logs tqig-portal; fi; docker rm -f tqig-portal >/dev/null' EXIT
          base=http://127.0.0.1:18770
          curl -fsS --retry 12 --retry-all-errors --retry-delay 1 --max-time 3 -H 'Host: tqig.space' "$base/api/portal/health" |
            jq -e '.localPreview == false'
          curl -fsS -H 'Host: tqig.space' "$base/signin" > /tmp/tqig-signin.html
          grep -q '/assets/index-' /tmp/tqig-signin.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: tqig.space' "$base/api/computers")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: tqig.space' "$base/api/status")" = 404
