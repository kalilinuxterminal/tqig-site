name: Deploy MinkMap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_STATIC_PAGES: '1'
          VITE_PAGES_DASHBOARD_URL: ${{ vars.TQIG_DASHBOARD_URL }}
      - name: Create pages for direct links and refreshes
        run: |
          cp dist/index.html dist/404.html
          for route in signin signup owner/setup preview dashboard overview settings snapscore remote phone account admin app app/walk app/drive app/locations app/devices app/settings privacy terms support; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
