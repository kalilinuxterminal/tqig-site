<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tqig</title>
<meta property="og:title" content="tqig" />
<meta property="og:description" content="tqig.space" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
  body{background:#000;color:#fff;min-height:100vh;overflow:hidden}
  .bg{position:fixed;inset:0;background:url('bg.jpg'),url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1920&auto=format&fit=crop') center/cover;filter:grayscale(1) brightness(.55);transform:scale(1.05)}
  .bg:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.75) 100%)}
  canvas#stars{position:fixed;inset:0;pointer-events:none;opacity:.9}
  #enter{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);cursor:pointer;transition:opacity .6s}
  #enter.hide{opacity:0;pointer-events:none}
  #enter span{font-size:18px;letter-spacing:3px;opacity:.9;animation:pulse 1.6s infinite;color:#fff}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  #main{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;filter:blur(10px) grayscale(1);transform:translateY(10px);transition:all .8s}
  #main.show{opacity:1;filter:grayscale(1);transform:none}
  .card{width:min(430px,94vw);background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:36px 30px 24px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.9)}
  .avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#fff,#555);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#000;border:3px solid rgba(255,255,255,.3);box-shadow:0 0 40px rgba(255,255,255,.25)}
  h1{font-size:32px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
  .uid{font-size:12px;opacity:.4;margin-top:2px;color:#aaa}
  .bio{margin:12px 0 6px;min-height:20px;font-size:14px;color:#e5e5e5}
  .bio:after{content:'▊';animation:blink 1s infinite;color:#fff}
  @keyframes blink{50%{opacity:0}}
  .location{font-size:12px;opacity:.5;margin-bottom:18px;color:#bbb}
  .links{display:flex;justify-content:center;gap:10px;margin:14px 0 8px}
  .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;transition:.15s}
  .icon:hover{background:#fff;color:#000;transform:translateY(-2px)}
  .icon svg{display:block}
  a.btn{display:block;text-decoration:none;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);padding:12px;border-radius:12px;margin:9px 0;font-weight:600;font-size:14px;transition:.15s}
  a.btn:hover{background:#fff;color:#000}
  .foot{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;opacity:.5;color:#999}
  #spotify{display:none}
  #soundToggle{position:fixed;top:16px;right:16px;z-index:10;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>
<button id="soundToggle">sound: on</button>
<!-- BACKGROUND SONG: put song.mp3 in this same folder. No visible player. -->
<audio id="bgm" loop preload="auto"><source src="song.mp3" type="audio/mpeg"></audio>
<div id="enter"><span>— click to enter —</span></div>
<div id="main">
  <div class="card">
    <div class="avatar">t</div>
    <h1>tqig</h1>
    <div class="uid">tqig.space</div>
    <div class="bio" id="typed"></div>
    <div class="location">★ black / white ★</div>
    <div class="links">
      <a class="icon" href="https://www.instagram.com/euroeth/" target="_blank" title="Instagram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
      <a class="icon" href="https://www.tiktok.com/@tqig" target="_blank" title="TikTok"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg></a>
    </div>
    <a class="btn" href="https://www.instagram.com/euroeth/" target="_blank">instagram — @euroeth</a>
    <a class="btn" href="https://www.tiktok.com/@tqig" target="_blank">tiktok — @tqig</a>
    <div class="foot"><span>© tqig</span><span>👁 <span id="views">1</span></span></div>
  </div>
</div>
<script>
const enter = document.getElementById('enter');
const main = document.getElementById('main');
const text = "welcome to tqig.space";
let i = 0;
enter.addEventListener('click', () => {
  enter.classList.add('hide');
  main.classList.add('show');
  type();
  // background music from start, no preview
  const a = document.getElementById('bgm');
  if (a){ a.currentTime = 0; a.volume = 0.8; a.play().catch(()=>{}); }
});
document.getElementById('soundToggle').onclick = e => {
  const a = document.getElementById('bgm');
  if(!a) return;
  if(a.paused){a.play();e.target.textContent='sound: on'}else{a.pause();e.target.textContent='sound: off'}
};
function type(){
  const el = document.getElementById('typed');
  if (i <= text.length){ el.textContent = text.slice(0,i); i++; setTimeout(type, 60); }
}
let v = localStorage.getItem('tqig_views') || 128;
v = parseInt(v)+1; localStorage.setItem('tqig_views', v);
document.getElementById('views').textContent = v;
// falling stars
const c = document.getElementById('stars'), x = c.getContext('2d');
let W,H,p=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
rs(); addEventListener('resize',rs);
for(let k=0;k<120;k++) p.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*1.8+.4,v:Math.random()*1.2+.3,tw:Math.random()*Math.PI*2});
(function loop(){x.clearRect(0,0,W,H);p.forEach(o=>{o.y+=o.v;o.tw+=.05;if(o.y>H){o.y=0;o.x=Math.random()*W}x.globalAlpha=.3+Math.abs(Math.sin(o.tw))*.7;x.fillStyle='#fff';x.beginPath();x.arc(o.x,o.y,o.s,0,7);x.fill()});requestAnimationFrame(loop)})();
</script>
</body>
</html>
